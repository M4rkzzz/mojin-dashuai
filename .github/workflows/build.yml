name: Build and verify Mojin Dashuai
on:
  push:
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm run check:ui
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-ui-checks
          path: .local/*.png
          include-hidden-files: true
          retention-days: 14
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: dotnet test tests/Hub.Tests/Hub.Tests.csproj -c Release --logger trx
      - run: dotnet test tests/GraphicsPreference.Tests/GraphicsPreference.Tests.csproj -c Release --logger trx
      - run: dotnet build tests/NativeAccountSmoke/NativeAccountSmoke.csproj -c Release
      - run: dotnet tests/NativeAccountSmoke/bin/Release/net10.0-windows/NativeAccountSmoke.dll --microsoft-contract
      - run: dotnet tests/NativeAccountSmoke/bin/Release/net10.0-windows/NativeAccountSmoke.dll --instance-state-smoke
      - run: dotnet tests/NativeAccountSmoke/bin/Release/net10.0-windows/NativeAccountSmoke.dll --dispatcher-install-smoke
      - run: dotnet tests/NativeAccountSmoke/bin/Release/net10.0-windows/NativeAccountSmoke.dll --content-layout-smoke .local/content-layout
      - run: dotnet publish tests/LauncherUpdateFixture/LauncherUpdateFixture.csproj -c Release -r win-x64 --self-contained true -o .local/launcher-update-fixture
      - run: dotnet tests/NativeAccountSmoke/bin/Release/net10.0-windows/NativeAccountSmoke.dll --launcher-update-smoke .local/launcher-update-fixture
      - run: dotnet publish src/Launcher.Desktop/Launcher.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=0.1.2-beta.11 -o artifacts/MojinDashuai
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          $compiler = ./tools/ensure-inno.ps1
          ./tools/build-installer.ps1 -Version 0.1.2-beta.11 -Source artifacts/MojinDashuai -Output artifacts/installer -Compiler $compiler
          ./tools/check-installer.ps1 -Version 0.1.2-beta.11 -Source artifacts/MojinDashuai -Compiler $compiler
      - uses: actions/upload-artifact@v4
        with:
          name: MojinDashuai-windows-x64-installer
          path: artifacts/installer/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: MojinDashuai-windows-x64-preview
          path: artifacts/MojinDashuai/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/Hub.Tests/TestResults/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-check-logs
          path: |
            .local/installer-acceptance/**/*.log
            .local/installer-acceptance/**/report.json
            .local/content-layout/*
          include-hidden-files: true
          retention-days: 14
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/Hub.Api/Hub.Api.csproj -c Release -o artifacts/api
      - uses: actions/upload-artifact@v4
        with:
          name: hub-api
          path: artifacts/api/
