name: Create launcher draft release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Launcher version, for example 0.1.0
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[a-z0-9.]+)?$') { throw 'Invalid version' }
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Require configured login and complete game sources
        shell: pwsh
        run: |
          if ($env:VERSION -match '-beta\.') { python tools/check-client-release.py --beta }
          else { python tools/check-client-release.py }
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm run build
        working-directory: ui
      - run: dotnet test tests/Hub.Tests/Hub.Tests.csproj -c Release
      - run: dotnet publish src/Launcher.Desktop/Launcher.Desktop.csproj -c Release -r win-x64 --self-contained true "-p:Version=$env:VERSION" -o artifacts/MojinDashuai
      - name: Build and verify player installer
        shell: pwsh
        run: |
          $compiler = ./tools/ensure-inno.ps1
          ./tools/build-installer.ps1 -Version $env:VERSION -Source artifacts/MojinDashuai -Output artifacts/installer -Compiler $compiler
          ./tools/check-installer.ps1 -Version $env:VERSION -Source artifacts/MojinDashuai -Compiler $compiler
      - run: dotnet build src/Publisher/Publisher.csproj -c Release
      - name: Package and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[a-z0-9.]+)?$') { throw 'Invalid version' }
          $sequence = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          dotnet src/Publisher/bin/Release/net10.0/Publisher.dll bundle-launcher artifacts/MojinDashuai $env:VERSION $sequence http://103.40.14.100:21708 artifacts/launcher-release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher bundle failed' }
          $setup = "artifacts/installer/MojinDashuai-Setup-$env:VERSION-x64.exe"
          @($setup, 'artifacts/launcher-release/MojinDashuai-windows-x64.zip') | ForEach-Object { $file = Get-Item $_; '{0}  {1}' -f (Get-FileHash $file.FullName).Hash.ToLowerInvariant(),$file.Name } | Set-Content artifacts/launcher-release/SHA256.txt
          gh release create "launcher-v$env:VERSION" $setup artifacts/launcher-release/MojinDashuai-windows-x64.zip artifacts/launcher-release/launcher-release.json artifacts/launcher-release/SHA256.txt --draft --title "魔金大帅 $env:VERSION" --notes '玩家请下载 Setup 安装包。ZIP 用于启动器内部更新。游戏内容与 Java 按需下载。'
