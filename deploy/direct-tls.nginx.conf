server {
    listen 8080 ssl;
    server_name launcher-direct.boshan.uk;
    ssl_certificate /etc/mojin-tls/live/launcher-direct.boshan.uk/fullchain.pem;
    ssl_certificate_key /etc/mojin-tls/live/launcher-direct.boshan.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MojinTLS:10m;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;
    access_log off;
    sendfile on;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    # Preserve published beta HTTP file URLs on the existing FRP TCP port.
    # Account requests are accepted only over TLS.
    error_page 497 = @legacy_files;
    location @legacy_files {
        if ($uri ~ ^/v1/) { return 426; }
        if ($uri ~ (^|/)\.) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($uri = /health) { return 200 'ok'; }
        try_files $uri =404;
    }
    location ~ (^|/)\. { deny all; }
    location /v1/ {
        proxy_pass http://hub-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host launcher-direct.boshan.uk;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location = /health { proxy_pass http://hub-api:8080/health; }
    location / { try_files $uri =404; }
}
