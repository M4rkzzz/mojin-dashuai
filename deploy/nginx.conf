server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;
    access_log off;
    sendfile on;
    add_header X-Content-Type-Options nosniff always;
    location ~ (^|/)\. { deny all; }
    location / { try_files $uri =404; }
    location = /health { access_log off; return 200 'ok'; }
}
