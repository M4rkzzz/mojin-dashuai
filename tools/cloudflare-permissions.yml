name: Check Boshan launcher Cloudflare access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check zone and tunnel access without exposing credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          def get(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/'+path,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
              try:
                  with urllib.request.urlopen(req) as r: data=json.load(r)
                  return {'allowed': bool(data.get('success')), 'count':len(data['result']) if isinstance(data.get('result'),list) else None}
              except urllib.error.HTTPError as e:
                  return {'allowed':False,'httpStatus':e.code}
          print(json.dumps({'zone':get('zones?name=boshan.uk'),'tunnels':get('accounts/'+os.environ['CF_ACCOUNT']+'/cfd_tunnel?is_deleted=false')},indent=2))
          PY
