<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#111711}body{font-family:'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif;color:#edf0e7;-webkit-font-smoothing:antialiased}
.poster{width:1080px;height:1920px;display:flex;flex-direction:column;position:relative;background:#111711;isolation:isolate;--accent:{{ACCENT}};overflow:hidden}
.poster:after{content:'';position:absolute;inset:0;border:1px solid #d7ebbd20;pointer-events:none}
.header{flex-shrink:0;position:relative;padding:40px 50px 34px;isolation:isolate;border-bottom:1px solid #d7ebbd25}
.header:before{content:'';position:absolute;inset:0;z-index:-2;background:url('{{BACKGROUND}}') center 43%/cover;opacity:.3}
.header:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#111711e6,#11171150),linear-gradient(0deg,#111711,transparent)}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:600}.brand img{height:46px;width:46px;object-fit:contain}.product{margin-left:4px;font-size:19px;font-weight:400;color:#abbba2}
.date{font-family:'Segoe UI',sans-serif;color:#a6b79b;font-size:26px;letter-spacing:1px}
h1{font-size:64px;line-height:1.25;font-weight:600;margin:30px 0 0;letter-spacing:1px}
.version{font-family:'Segoe UI',sans-serif;font-size:20px;color:#98ac8b;margin:0}
.content{flex:1;min-height:0;padding:24px 50px 30px}
.changes{list-style:none;margin:0;padding:0;counter-reset:change}
.changes li{counter-increment:change;display:flex;gap:18px;padding:8px 0;font-size:40px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.changes li:before{content:counter(change) '.';color:var(--accent);font-family:'Segoe UI',sans-serif;min-width:36px;flex-shrink:0}
.changes li span{min-width:0;text-wrap:pretty}
.notes{border-top:1px solid #d7ebbd25;padding-top:22px;margin-top:16px}
.notes p{font-size:22px;line-height:1.85;color:#aabb9f;margin:8px 0;white-space:pre-line;overflow-wrap:anywhere}
.footer{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:30px 50px 36px;border-top:1px solid #d7ebbd20;font-size:34px;color:#c3d1b9;gap:22px}
.footer small{font-size:17px;color:#8fa182}
</style>
</head>
<body><article class="poster">
<header class="header"><div class="brand-row"><div class="brand"><img src="{{LOGO}}" alt="">{{BRAND}}</div><span class="date">{{DATE}}</span></div><h1>{{HEADING}}</h1></header>
<main class="content"><ol class="changes">{{CHANGES}}</ol>{{NOTES}}</main>
{{FOOTER_BLOCK}}
</article></body></html>
